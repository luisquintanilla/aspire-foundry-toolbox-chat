<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="760"
     viewBox="0 0 1200 760"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Aspire Foundry Toolbox Chat system architecture</title>
  <desc id="desc">The Aspire AppHost control plane configures a Web application and local MarkItDown container. In the application data plane, a Blazor UI calls a Microsoft Extensions AI pipeline. The pipeline uses an Azure chat model, local semantic search, and a host-neutral Foundry Toolbox client over the MCP C Sharp SDK.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" class="arrow-fill"/>
    </marker>
    <style>
      :root { color-scheme: light dark; }
      .background { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .box { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
      .azure { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; }
      .local { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .candidate { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
      .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #64748b; stroke-dasharray: 7 6; stroke-width: 2; marker-end: url(#arrow); }
      .arrow-fill { fill: #475569; }
      .title { fill: #0f172a; font: 700 28px Arial, sans-serif; }
      .heading { fill: #0f172a; font: 700 19px Arial, sans-serif; }
      .label { fill: #0f172a; font: 600 16px Arial, sans-serif; text-anchor: middle; }
      .small { fill: #334155; font: 14px Arial, sans-serif; text-anchor: middle; }
      .note { fill: #475569; font: italic 14px Arial, sans-serif; }
      @media (prefers-color-scheme: dark) {
        .background { fill: #0f172a; }
        .panel { fill: #111827; stroke: #94a3b8; }
        .box { fill: #1e1b4b; stroke: #a5b4fc; }
        .azure { fill: #082f49; stroke: #7dd3fc; }
        .local { fill: #052e2b; stroke: #6ee7b7; }
        .candidate { fill: #451a03; stroke: #fbbf24; }
        .line, .dashed { stroke: #cbd5e1; }
        .arrow-fill { fill: #cbd5e1; }
        .title, .heading, .label { fill: #f8fafc; }
        .small, .note { fill: #cbd5e1; }
      }
    </style>
  </defs>

  <rect class="background" width="1200" height="760"/>
  <text class="title" x="44" y="48">Aspire + Foundry Toolbox architecture</text>

  <rect class="panel" x="35" y="75" width="1130" height="185" rx="18"/>
  <text class="heading" x="58" y="108">AppHost control plane</text>
  <text class="note" x="940" y="106">Resource description and startup only</text>

  <rect class="box" x="70" y="130" width="210" height="92" rx="12"/>
  <text class="label" x="175" y="165">Aspire AppHost</text>
  <text class="small" x="175" y="190">Selects resource mode</text>

  <rect class="local" x="350" y="130" width="210" height="92" rx="12"/>
  <text class="label" x="455" y="160">Existing mode</text>
  <text class="small" x="455" y="184">External connections</text>
  <text class="small" x="455" y="204">No Azure writes</text>

  <rect class="candidate" x="630" y="130" width="220" height="92" rx="12"/>
  <text class="label" x="740" y="160">Managed mode</text>
  <text class="small" x="740" y="184">Explicit provisioning</text>
  <text class="small" x="740" y="204">Guarded reconciliation</text>

  <rect class="local" x="920" y="130" width="205" height="92" rx="12"/>
  <text class="label" x="1022" y="160">MarkItDown</text>
  <text class="small" x="1022" y="184">Pinned local container</text>
  <text class="small" x="1022" y="204">MCP 2024-11-05</text>

  <path class="line" d="M280 160 H350"/>
  <path class="line" d="M280 195 C420 250, 550 245, 630 195"/>
  <path class="line" d="M850 176 H920"/>

  <rect class="panel" x="35" y="290" width="1130" height="420" rx="18"/>
  <text class="heading" x="58" y="325">Application data plane</text>
  <text class="note" x="880" y="323">Live user traffic and credentials</text>

  <rect class="box" x="65" y="360" width="180" height="88" rx="12"/>
  <text class="label" x="155" y="395">Blazor UI</text>
  <text class="small" x="155" y="420">Chat, approval, consent</text>

  <rect class="box" x="300" y="350" width="245" height="108" rx="12"/>
  <text class="label" x="422" y="384">MEAI chat pipeline</text>
  <text class="small" x="422" y="410">Toolbox attachment</text>
  <text class="small" x="422" y="432">Function invocation + telemetry</text>

  <rect class="azure" x="625" y="360" width="220" height="88" rx="12"/>
  <text class="label" x="735" y="395">Azure chat model</text>
  <text class="small" x="735" y="420">The only IChatClient model</text>

  <path class="line" d="M245 404 H300"/>
  <path class="line" d="M545 404 H625"/>

  <rect class="candidate" x="300" y="505" width="245" height="100" rx="12"/>
  <text class="label" x="422" y="538">FoundryToolbox.Client</text>
  <text class="small" x="422" y="562">Endpoint, Entra, policy</text>
  <text class="small" x="422" y="584">Discovery and lifecycle</text>

  <rect class="box" x="625" y="505" width="220" height="100" rx="12"/>
  <text class="label" x="735" y="540">MCP C# SDK</text>
  <text class="small" x="735" y="564">Initialize, list, call</text>
  <text class="small" x="735" y="586">Transport and JSON-RPC</text>

  <rect class="azure" x="925" y="505" width="200" height="100" rx="12"/>
  <text class="label" x="1025" y="538">Foundry Toolbox</text>
  <text class="small" x="1025" y="562">Web Search</text>
  <text class="small" x="1025" y="584">Remote MCP sources</text>

  <path class="line" d="M422 458 V505"/>
  <path class="line" d="M545 555 H625"/>
  <path class="line" d="M845 555 H925"/>

  <rect class="local" x="65" y="530" width="180" height="150" rx="12"/>
  <text class="label" x="155" y="562">Local knowledge</text>
  <text class="small" x="155" y="588">Sample documents</text>
  <text class="small" x="155" y="610">MarkItDown + chunks</text>
  <text class="small" x="155" y="632">Azure embeddings</text>
  <text class="small" x="155" y="654">SQLite vector search</text>

  <path class="dashed" d="M245 585 C275 560, 280 470, 330 458"/>
  <text class="note" x="555" y="670">Candidate libraries are non-packable proving projects; package ownership remains open.</text>
</svg>
