<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="860"
     viewBox="0 0 1200 860"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Chat request and tool approval flow</title>
  <desc id="desc">A sequence diagram from the user interface through the Microsoft Extensions AI pipeline and Azure model. Local functions run against local search. Remote Foundry Toolbox functions pause for visible user approval before an MCP call.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" class="arrow-fill"/>
    </marker>
    <style>
      :root { color-scheme: light dark; }
      .background { fill: #f8fafc; }
      .participant { fill: #ffffff; stroke: #4f46e5; stroke-width: 2; }
      .local-participant { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .remote-participant { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; }
      .lifeline { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; }
      .message { stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .return { stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .approval { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
      .arrow-fill { fill: #475569; }
      .title { fill: #0f172a; font: 700 28px Arial, sans-serif; }
      .label { fill: #0f172a; font: 600 15px Arial, sans-serif; text-anchor: middle; }
      .text { fill: #0f172a; font: 14px Arial, sans-serif; }
      .small { fill: #475569; font: 13px Arial, sans-serif; }
      .number { fill: #ffffff; font: 700 12px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .number-bg { fill: #4f46e5; }
      @media (prefers-color-scheme: dark) {
        .background { fill: #0f172a; }
        .participant { fill: #1e1b4b; stroke: #a5b4fc; }
        .local-participant { fill: #052e2b; stroke: #6ee7b7; }
        .remote-participant { fill: #082f49; stroke: #7dd3fc; }
        .approval { fill: #451a03; stroke: #fbbf24; }
        .lifeline, .message, .return { stroke: #cbd5e1; }
        .arrow-fill { fill: #cbd5e1; }
        .title, .label, .text { fill: #f8fafc; }
        .small { fill: #cbd5e1; }
        .number-bg { fill: #818cf8; }
      }
    </style>
  </defs>

  <rect class="background" width="1200" height="860"/>
  <text class="title" x="42" y="48">Chat request flow</text>

  <rect class="participant" x="45" y="80" width="170" height="66" rx="10"/>
  <text class="label" x="130" y="108">User + Blazor UI</text>
  <text class="label" x="130" y="130">approval surface</text>

  <rect class="participant" x="285" y="80" width="190" height="66" rx="10"/>
  <text class="label" x="380" y="108">MEAI pipeline</text>
  <text class="label" x="380" y="130">middleware</text>

  <rect class="remote-participant" x="545" y="80" width="170" height="66" rx="10"/>
  <text class="label" x="630" y="118">Azure chat model</text>

  <rect class="local-participant" x="785" y="80" width="170" height="66" rx="10"/>
  <text class="label" x="870" y="108">Local knowledge</text>
  <text class="label" x="870" y="130">SQLite search</text>

  <rect class="remote-participant" x="1025" y="80" width="150" height="66" rx="10"/>
  <text class="label" x="1100" y="108">Foundry</text>
  <text class="label" x="1100" y="130">Toolbox MCP</text>

  <line class="lifeline" x1="130" y1="146" x2="130" y2="815"/>
  <line class="lifeline" x1="380" y1="146" x2="380" y2="815"/>
  <line class="lifeline" x1="630" y1="146" x2="630" y2="815"/>
  <line class="lifeline" x1="870" y1="146" x2="870" y2="815"/>
  <line class="lifeline" x1="1100" y1="146" x2="1100" y2="815"/>

  <circle class="number-bg" cx="155" cy="190" r="13"/>
  <text class="number" x="155" y="190">1</text>
  <line class="message" x1="170" y1="190" x2="370" y2="190"/>
  <text class="text" x="185" y="180">Conversation + local functions</text>

  <circle class="number-bg" cx="405" cy="245" r="13"/>
  <text class="number" x="405" y="245">2</text>
  <path class="message" d="M420 245 H1088"/>
  <text class="text" x="450" y="234">Discover or reuse cached Toolbox functions</text>

  <line class="return" x1="1090" y1="290" x2="392" y2="290"/>
  <text class="small" x="670" y="280">Approval-decorated AIFunction instances</text>

  <circle class="number-bg" cx="405" cy="345" r="13"/>
  <text class="number" x="405" y="345">3</text>
  <line class="message" x1="420" y1="345" x2="618" y2="345"/>
  <text class="text" x="442" y="334">Model request with all tools</text>

  <rect class="local-participant" x="500" y="385" width="455" height="125" rx="12"/>
  <text class="label" x="727" y="410">Local-function path</text>
  <circle class="number-bg" cx="655" cy="449" r="13"/>
  <text class="number" x="655" y="449">4</text>
  <line class="message" x1="670" y1="449" x2="858" y2="449"/>
  <text class="text" x="688" y="438">Load or search documents</text>
  <line class="return" x1="858" y1="483" x2="642" y2="483"/>
  <text class="small" x="680" y="475">Selected excerpts return to model context</text>

  <rect class="approval" x="45" y="545" width="430" height="130" rx="12"/>
  <text class="label" x="260" y="573">Remote-function path</text>
  <circle class="number-bg" cx="655" cy="605" r="13"/>
  <text class="number" x="655" y="605">5</text>
  <line class="message" x1="618" y1="605" x2="392" y2="605"/>
  <text class="text" x="410" y="594">Approval request</text>
  <text class="small" x="68" y="615">UI shows destination, function, and arguments.</text>
  <text class="small" x="68" y="640">Deny stops the call. Approve continues it.</text>

  <circle class="number-bg" cx="155" cy="720" r="13"/>
  <text class="number" x="155" y="720">6</text>
  <line class="message" x1="170" y1="720" x2="368" y2="720"/>
  <text class="text" x="190" y="708">Approval response</text>

  <circle class="number-bg" cx="405" cy="760" r="13"/>
  <text class="number" x="405" y="760">7</text>
  <line class="message" x1="420" y1="760" x2="1088" y2="760"/>
  <text class="text" x="470" y="750">Approved tools/call, sent at most once</text>

  <line class="return" x1="1090" y1="800" x2="642" y2="800"/>
  <text class="small" x="765" y="790">Tool result feeds the final model turn</text>
  <line class="return" x1="618" y1="830" x2="142" y2="830"/>
  <text class="small" x="250" y="820">Streamed answer + citations</text>
</svg>
